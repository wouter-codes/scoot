{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <p class="mb-3 back-link">
                <a href="{% url 'my_rides' %}" class="text-decoration-none">&larr; Back to my rides</a>
            </p>
            <h1 class="mb-4">Edit Ride</h1>
            <p class="text-muted mb-4">Update your ride details below.</p>
            <div class="card">
                <div class="card-body">
                    <form id="editRideForm" method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <input type="hidden" name="publish" id="publishHiddenInput" value="">
                        <div class="d-grid gap-2 d-md-flex justify-content-md-between mt-3">
                            <a href="{% url 'my_rides' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button type="button" name="save_draft" id="saveDraftBtn" class="btn btn-secondary">Save as Draft</button>
                            <button type="button" class="btn btn-success" id="openPublishModalBtn" data-bs-toggle="modal" data-bs-target="#publishModal">Publish</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
